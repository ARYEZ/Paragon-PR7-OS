name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<version>) from this commit"
        type: boolean
        default: false
      iso:
        description: "Build and boot-test the ISO (added to this version's release if it's already out)"
        type: boolean
        default: false

env:
  APPS: "e w l f r p m z db hx wm fs tm hb bk pm sm hw du q is ln cb ar un"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The family's apps (their code goes into the image)
        run: |
          mkdir -p family
          for a in $APPS; do
            git clone -q --depth 1 "https://github.com/ARYEZ/Paragon-PR7-${a^^}" "family/paragon-pr7-$a"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libpulse0 grub-common
          pip install -q pytest PySide6 PyQt6 PyQt6-QScintilla paramiko keyring pyte psutil pykeepass mutagen Pillow pyyaml
      - name: Tests (the generated theme files, the login screen, every app starting on Linux)
        env:
          PR7OS_FAMILY: ${{ github.workspace }}/family
        run: python -m pytest -q

  update-test:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: A real update in Debian 13 (old updater installed with apt, updated by the helper from a stand-in release)
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:trixie bash -c \
            "apt-get update -qq && apt-get install -y -qq python3 dpkg-dev > /dev/null && python3 tools/update_test.py"

  packages:
    # every version: the five packages, installed into a clean Debian 13 the way the updater installs them, then
    # published (the update channel). The ISO is built only for x.y.0 versions, tags or by hand (the iso job).
    needs: [test, update-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      iso: ${{ steps.version.outputs.iso }}
    steps:
      - uses: actions/checkout@v4
      - name: Which version, and does it get an ISO?
        id: version
        run: |
          v=$(python3 -c 'import pr7os; print(pr7os.__version__)')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PR7OS_VERSION=$v" >> "$GITHUB_ENV"
          iso=false
          case "$v" in *.0) iso=true;; esac
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = true ] || [ "${{ inputs.iso }}" = true ]; then iso=true; fi
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "PR7-OS $v: ISO $iso"
      - name: The family's apps
        run: |
          mkdir -p family
          for a in $APPS; do
            git clone -q --depth 1 "https://github.com/ARYEZ/Paragon-PR7-${a^^}" "family/paragon-pr7-$a"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The packages' files (theme and apps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libfontconfig1
          pip install -q PySide6 Pillow
          QT_QPA_PLATFORM=offscreen python -m pr7os.assets build/root
          python -m pr7os.apps family build/root
      - name: Build the packages (in Debian 13)
        run: |
          docker run --rm -v "$PWD:/work" debian:trixie bash /work/live/packages.sh
          sudo chown -R "$USER" debs
          cp debs/paragon-pr7os-updates_*_all.deb debs/paragon-pr7os-updates.deb
          ls -la debs
      - name: Install them into a clean Debian 13, as the updater does, and check what they set up
        run: docker run --rm -v "$PWD:/work" debian:trixie bash /work/live/install_test.sh
      - name: Is this version released yet? (x.y.0 versions are published by the iso job, with their ISO)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && steps.version.outputs.iso != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR7OS_VERSION" in 0.0.*) echo "$PR7OS_VERSION is a development build: nothing to publish."; exit 0;; esac
          if gh release view "v$PR7OS_VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "v$PR7OS_VERSION is already released."
          else
            echo "v$PR7OS_VERSION has no release yet: publishing it."; echo "AUTO_RELEASE=1" >> "$GITHUB_ENV"
          fi
      - name: Release notes
        if: env.AUTO_RELEASE == '1' || (github.event_name == 'workflow_dispatch' && inputs.release && steps.version.outputs.iso != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso_tag=$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '[.[] | select(any(.assets[]; .name | endswith(".iso.sha256")))][0].tag_name // ""')
          ISO_TAG="$iso_tag" python - <<'PY'
          import os, re
          v, iso = os.environ["PR7OS_VERSION"], os.environ.get("ISO_TAG", "")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          notes = (m.group(1).strip() if m else "Paragon PR7-OS " + v) + "\n"
          notes += ("\n**An update, no ISO**: installed machines get it from PR7-OS Update (or `sudo "
                    "/usr/libexec/paragon/pr7os-update-helper` over SSH).")
          if iso:
              notes += (f" For a new install, use the ISO of [{iso}](https://github.com/ARYEZ/Paragon-PR7-OS/releases/"
                        f"tag/{iso}) and update afterwards.")
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
          cat release-notes.md
      - name: Newest version? (GitHub marks the last release published "latest"; an older one built more slowly mustn't take it)
        if: env.AUTO_RELEASE == '1' || (github.event_name == 'workflow_dispatch' && inputs.release && steps.version.outputs.iso != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[].tag_name]' > tags.json
          python - <<'PY'
          import json, os
          key = lambda v: tuple(int(x) if x.isdigit() else 0 for x in v.lstrip("v").split("."))
          mine = key(os.environ["PR7OS_VERSION"])
          newest = all(mine >= key(t) for t in json.load(open("tags.json")))
          print("newest" if newest else "an older version than one already out: not marked latest")
          open(os.environ["GITHUB_ENV"], "a").write(f"MAKE_LATEST={'true' if newest else 'false'}\n")
          PY
      - name: Release (the packages and the manifest)
        if: env.AUTO_RELEASE == '1' || (github.event_name == 'workflow_dispatch' && inputs.release && steps.version.outputs.iso != 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PR7OS_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            debs/*.deb
            debs/pr7os-update.json
          name: Paragon PR7-OS v${{ env.PR7OS_VERSION }}
          make_latest: ${{ env.MAKE_LATEST || 'true' }}

  iso:
    needs: [test, update-test, packages]
    if: needs.packages.outputs.iso == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Room for the build (the runner's preinstalled SDKs out)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: The family's apps
        run: |
          mkdir -p family
          for a in $APPS; do
            git clone -q --depth 1 "https://github.com/ARYEZ/Paragon-PR7-${a^^}" "family/paragon-pr7-$a"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The image's files (theme and apps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libfontconfig1
          pip install -q PySide6 Pillow
          QT_QPA_PLATFORM=offscreen python -m pr7os.assets build/root
          python -m pr7os.apps family build/root
          echo "PR7OS_VERSION=$(python -c 'import pr7os; print(pr7os.__version__)')" >> "$GITHUB_ENV"
      - name: Build the ISO (Debian's live-build, in Debian 13)
        run: docker run --rm --privileged -v "$PWD:/work" debian:trixie bash /work/live/build.sh
      - name: The ISO
        run: |
          iso=$(ls live/*.iso | head -1)
          sudo chown "$USER" "$iso"
          mv "$iso" "PR7-OS-$PR7OS_VERSION-amd64.iso"
          echo "ISO=PR7-OS-$PR7OS_VERSION-amd64.iso" >> "$GITHUB_ENV"
          ls -la PR7-OS-*.iso
          sha256sum PR7-OS-*.iso > "PR7-OS-$PR7OS_VERSION-amd64.iso.sha256"
          sudo chown -R "$USER" debs
          cp debs/paragon-pr7os-updates_*_all.deb debs/paragon-pr7os-updates.deb
          ls -la debs
          tail -n 30 live/build.log || true
      - name: Boot it (QEMU with KVM) and take screenshots
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -q qemu-system-x86 ovmf xorriso
          python tools/boot_test.py "$ISO" shots
      - name: Screenshots to the ci-boot-screens branch (written only by CI)
        if: always()
        run: |
          mkdir -p shots && cd shots
          cp ../live/build.log build.log 2>/dev/null || true
          echo "$GITHUB_SHA" > commit.txt
          git init -q && git checkout -q -b ci-boot-screens
          git add -A
          git -c user.name="PR7-OS CI" -c user.email="ci@users.noreply.github.com" commit -qm "Boot test of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-boot-screens
      - name: Is this version released yet? (an x.y.0 version is published here, with its ISO; 0.0.x never is)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR7OS_VERSION" in 0.0.*) echo "$PR7OS_VERSION is a development build: nothing to publish."; exit 0;; esac
          if gh release view "v$PR7OS_VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              echo "v$PR7OS_VERSION is already released: its ISO is added to it."; echo "ADD_ISO=1" >> "$GITHUB_ENV"
            else
              echo "v$PR7OS_VERSION is already released."
            fi
          elif [ "${{ github.event_name }}" = push ] || [ "${{ inputs.release }}" = true ]; then
            echo "v$PR7OS_VERSION has no release yet: publishing it."; echo "AUTO_RELEASE=1" >> "$GITHUB_ENV"
          fi
      - name: Release notes and the download (a GitHub release file holds at most 2 GB)
        if: env.AUTO_RELEASE == '1' || env.ADD_ISO == '1'
        run: |
          python - <<'PY'
          import os, re
          v = os.environ["PR7OS_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          open("release-notes.md", "w", encoding="utf-8").write((m.group(1).strip() if m else "Paragon PR7-OS " + v) + "\n")
          PY
          size=$(stat -c %s "$ISO")
          if [ "$size" -ge 2000000000 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            rm "$ISO"
            printf '\nThe ISO comes in parts (GitHub release files stop at 2 GB). Join them before writing to a USB stick:\n\n    cat %s.part* > %s        (Windows: copy /b %s.part0+%s.part1 %s)\n\nthen check it with the .sha256 file.\n' "$ISO" "$ISO" "$ISO" "$ISO" "$ISO" >> release-notes.md
          fi
          ls -la PR7-OS-*
      - name: The ISO added to the version's release (its packages and notes stay as they were)
        if: env.ADD_ISO == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$PR7OS_VERSION" --repo "${{ github.repository }}" --clobber PR7-OS-*.iso* \
            shots/desktop.png shots/login.png shots/boot_menu.png shots/lock_screen.png shots/apps.png
      - name: Newest version? (GitHub marks the last release published "latest"; an older one built more slowly mustn't take it)
        if: env.AUTO_RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[].tag_name]' > tags.json
          python - <<'PY'
          import json, os
          key = lambda v: tuple(int(x) if x.isdigit() else 0 for x in v.lstrip("v").split("."))
          mine = key(os.environ["PR7OS_VERSION"])
          newest = all(mine >= key(t) for t in json.load(open("tags.json")))
          print("newest" if newest else "an older version than one already out: not marked latest")
          open(os.environ["GITHUB_ENV"], "a").write(f"MAKE_LATEST={'true' if newest else 'false'}\n")
          PY
      - name: Release
        if: env.AUTO_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          make_latest: ${{ env.MAKE_LATEST || 'true' }}
          tag_name: v${{ env.PR7OS_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            PR7-OS-*.iso
            PR7-OS-*.iso.part*
            PR7-OS-*.iso.sha256
            debs/*.deb
            debs/pr7os-update.json
            shots/desktop.png
            shots/login.png
            shots/boot_menu.png
            shots/lock_screen.png
            shots/apps.png
          name: Paragon PR7-OS v${{ env.PR7OS_VERSION }}
